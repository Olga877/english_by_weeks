<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2b85;stop-opacity:1" />
    </linearGradient>

    <!-- Градиент для буквы (металлик) -->
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="100" height="100" rx="22" fill="url(#bgGradient)"/>

  <!-- Тень-дублёр для 3D-эффекта -->
  <text x="52" y="72" font-size="58" text-anchor="middle"
        fill="#1e1b4b" fill-opacity="0.4" font-family="Arial, sans-serif" font-weight="bold">
    E
  </text>

  <!-- Основная буква с градиентом -->
  <text x="48" y="68" font-size="58" text-anchor="middle"
        fill="url(#letterGradient)" font-family="Arial, sans-serif" font-weight="bold"
        style="text-shadow: 1px 1px 0px rgba(0,0,0,0.15);">
    E
  </text>

</svg>