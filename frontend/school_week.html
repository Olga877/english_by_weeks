<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Школьная неделя | English by Weeks</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="/english_by_weeks/frontend/icons/icon.svg">
    <link rel="shortcut icon" href="/english_by_weeks/frontend/icons/icon-72.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
</head>
<body class="school-theme">
    <div class="container">
        <div class="nav-buttons-top">
            <button class="btn-home" id="homeBtnTop">🏠 Домой</button>
            <button class="btn-back" id="backBtnTop">← Назад</button>
        </div>

        <header>
            <h1 id="weekTitle">Загрузка...</h1>
            <p id="weekDescription"></p>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Тёмная/Светлая</button>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="completedDays">0</div>
                <div class="stat-label">дней пройдено</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgScore">0%</div>
                <div class="stat-label">средний балл</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="currentStreak">0</div>
                <div class="stat-label">серия 🔥</div>
            </div>
        </div>

        <div class="days-container" id="daysContainer"></div>

        <div class="nav-buttons-bottom">
            <button class="btn-home" id="homeBtnBottom">🏠 Домой</button>
            <button class="btn-back" id="backBtnBottom">← Назад</button>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/school_week.js"></script>
<footer class="site-footer">
    <p>© <span id="currentYear"></span> English by Weeks. Все права защищены.</p>
    <div class="footer-links">
        <a href="/english_by_weeks/frontend/terms.html">Условия использования</a> |
        <a href="/english_by_weeks/frontend/privacy.html">Политика конфиденциальности</a>
    </div>
</footer>
</body>
</html>
